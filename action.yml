name: "Go - Test Suites"
description: "Run your test suites with a failure-focused summary, GitHub annotations, and coverage reporting"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  packages:
    description: "Package patterns to test"
    default: "./..."
  race:
    description: "Enable race detector"
    default: "false"
  coverage:
    description: "Enable coverage profiling and reporting"
    default: "false"
  min-coverage:
    description: "Minimum coverage percentage (0-100, fails if below)"
    required: false
  flags:
    description: "Additional gotest flags (--double-dash style)"
    required: false
  go-test-flags:
    description: "Additional go test flags (-single-dash style)"
    required: false
  badge:
    description: "Render a coverage badge and, on the default branch, publish it as coverage.svg to the badge-branch of this repository (needs contents: write). Turns coverage on."
    default: "false"
  badge-branch:
    description: "Branch the coverage badge is published to; created automatically on first use"
    default: "ci/badges"
  bench:
    description: "Run benchmarks after tests (gotest bench --spec)"
    default: "false"
  bench-baseline:
    description: "Baseline JSON file to compare benchmarks against (gotest bench --against)"
    required: false
  bench-gate:
    description: "Fail the run if any benchmark regresses by more than this percent (gotest bench --gate)"
    required: false
  bench-save:
    description: "Save the benchmark run as a JSON baseline at this path (gotest bench --save); an explicit empty string saves to bench.baseline from .gotest.yml"
    default: "false"
  version:
    description: "gotest version: 'gomod' (default) resolves from go.mod, or a version tag (e.g. v1.0.0, latest) to install globally."
    default: "gomod"

outputs:
  exit-code:
    description: "Test process exit code"
    value: ${{ steps.test.outputs.exit-code }}
  coverage:
    description: "Coverage percentage (empty if coverage not enabled)"
    value: ${{ steps.test.outputs.coverage }}
  badge:
    description: "Path of the rendered coverage badge SVG (empty unless badge is enabled and the tests ran)"
    value: ${{ steps.test.outputs.badge }}
  bench-report:
    description: "Path to the gotest bench --json report file (empty if bench not enabled)"
    value: ${{ steps.bench.outputs.bench-report }}
  bench-breached-keys:
    description: "Comma-joined benchmark keys that breached the gate (empty if none or no gate)"
    value: ${{ steps.bench.outputs.bench-breached-keys }}

runs:
  using: "composite"
  steps:
    - name: Install gotest
      if: ${{ inputs.version != 'gomod' }}
      shell: bash
      run: go install github.com/mvrahden/go-test/cmd/gotest@${{ inputs.version }}

    - name: Run tests
      id: test
      shell: bash
      env:
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_RACE: ${{ inputs.race }}
        INPUT_COVERAGE: ${{ inputs.coverage }}
        INPUT_MIN_COVERAGE: ${{ inputs.min-coverage }}
        INPUT_FLAGS: ${{ inputs.flags }}
        INPUT_GO_TEST_FLAGS: ${{ inputs.go-test-flags }}
        INPUT_BADGE: ${{ inputs.badge }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$INPUT_VERSION" != "gomod" ]; then
          cmd=(gotest)
        else
          cmd=(go run github.com/mvrahden/go-test/cmd/gotest)
        fi

        args=(summary --github)

        gtflags=()
        if [ -n "$INPUT_GO_TEST_FLAGS" ]; then
          read -ra gtflags <<< "$INPUT_GO_TEST_FLAGS"
        fi

        # A -coverprofile the caller passes through go-test-flags is the
        # run's profile; the action only adds a temporary one when nobody did.
        user_profile=""
        for ((i = 0; i < ${#gtflags[@]}; i++)); do
          case "${gtflags[i]}" in
            -coverprofile=*) user_profile="${gtflags[i]#-coverprofile=}" ;;
            -coverprofile) user_profile="${gtflags[i+1]:-}" ;;
          esac
        done

        cover_profile=""
        temp_profile=""
        if [ "$INPUT_COVERAGE" = "true" ] || [ "$INPUT_BADGE" = "true" ]; then
          if [ -n "$user_profile" ]; then
            cover_profile="$user_profile"
          else
            cover_profile="$(mktemp -t gotest-cover-XXXXXX.out)"
            temp_profile="$cover_profile"
          fi
          args+=("--coverage=$cover_profile")
        fi

        badge_file=""
        if [ "$INPUT_BADGE" = "true" ]; then
          badge_file="${RUNNER_TEMP}/gotest-coverage-badge.svg"
          rm -f "$badge_file"
          args+=("--badge=$badge_file")
        fi

        if [ -n "$INPUT_MIN_COVERAGE" ]; then
          args+=("--min=$INPUT_MIN_COVERAGE")
        fi

        if [ -n "$INPUT_FLAGS" ]; then
          read -ra extra <<< "$INPUT_FLAGS"
          args+=("${extra[@]}")
        fi

        read -ra pkgs <<< "$INPUT_PACKAGES"
        args+=("${pkgs[@]}")

        if [ "$INPUT_RACE" = "true" ]; then
          args+=(-race)
        fi

        if [ -n "$temp_profile" ]; then
          args+=("-coverprofile=$temp_profile")
        fi

        if [ ${#gtflags[@]} -gt 0 ]; then
          args+=("${gtflags[@]}")
        fi

        set +e
        "${cmd[@]}" "${args[@]}"
        exit_code=$?
        set -e

        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"

        if [ -n "$cover_profile" ] && [ -f "$cover_profile" ]; then
          # A profile go tool cover rejects must not fail a step whose tests
          # already have their verdict; the coverage output just stays empty.
          if cov=$(go tool cover -func="$cover_profile" | tail -1 | awk '{print $NF}' | sed 's/%//'); then
            echo "coverage=$cov" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not compute the coverage output from ${cover_profile}"
          fi
          [ -n "$temp_profile" ] && rm -f "$temp_profile"
        fi

        if [ -n "$badge_file" ] && [ -f "$badge_file" ]; then
          echo "badge=$badge_file" >> "$GITHUB_OUTPUT"
        fi

        exit "$exit_code"

    # The badge follows the default branch only: a pull request or feature
    # branch must never rewrite it. Exit code 2 means the suites did not run
    # to completion (build failure, bad invocation), so there is nothing
    # trustworthy to publish; 0 and 1 (tests failed or the minimum was
    # missed) still describe the real coverage of the branch.
    - name: Publish coverage badge
      if: ${{ !cancelled() && inputs.badge == 'true' && steps.test.outputs.badge != '' && steps.test.outputs.exit-code != '2' }}
      shell: bash
      env:
        BADGE_FILE: ${{ steps.test.outputs.badge }}
        BADGE_BRANCH: ${{ inputs.badge-branch }}
        COVERAGE: ${{ steps.test.outputs.coverage }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -z "$DEFAULT_BRANCH" ] && command -v gh >/dev/null 2>&1; then
          DEFAULT_BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch 2>/dev/null || true)
        fi
        if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
          echo "Coverage badge is published from ${DEFAULT_BRANCH:-the default branch} only; skipping on ${GITHUB_REF}"
          exit 0
        fi

        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        work="${RUNNER_TEMP}/gotest-badge-publish"
        trap 'rm -rf "$work"' EXIT

        # Each attempt starts from the branch's current tip, so a concurrent
        # job's push (e.g. another matrix cell) only costs a retry.
        for attempt in 1 2 3; do
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          git init -q
          git remote add origin "$remote"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch -q --depth 1 origin "refs/heads/${BADGE_BRANCH}" 2>/dev/null; then
            git checkout -q -B "$BADGE_BRANCH" FETCH_HEAD
          else
            git checkout -q --orphan "$BADGE_BRANCH"
          fi

          cp "$BADGE_FILE" coverage.svg
          {
            echo "# ${BADGE_BRANCH}"
            echo
            echo "Files on this branch are written by the gotest GitHub Action (\`badge: true\`); edits are overwritten on the next run."
            echo
            echo "![Coverage](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BADGE_BRANCH}/coverage.svg)"
          } > README.md

          git add -A
          if git diff --cached --quiet; then
            echo "Coverage badge unchanged (${COVERAGE}%)"
            exit 0
          fi
          git commit -q -m "coverage: ${COVERAGE}%"
          if git push -q origin "HEAD:refs/heads/${BADGE_BRANCH}" 2>push.log; then
            echo "Coverage badge published: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BADGE_BRANCH}/coverage.svg"
            exit 0
          fi
          echo "push attempt ${attempt} failed:"
          cat push.log
          sleep "$attempt"
        done

        echo "::warning::Coverage badge not published: could not push to ${BADGE_BRANCH}. Does the job grant 'contents: write'?"
        exit 0

    - name: Run benchmarks
      id: bench
      if: ${{ inputs.bench == 'true' }}
      shell: bash
      env:
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_BENCH_BASELINE: ${{ inputs.bench-baseline }}
        INPUT_BENCH_GATE: ${{ inputs.bench-gate }}
        INPUT_BENCH_SAVE: ${{ inputs.bench-save }}
        INPUT_FLAGS: ${{ inputs.flags }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$INPUT_VERSION" != "gomod" ]; then
          cmd=(gotest)
        else
          cmd=(go run github.com/mvrahden/go-test/cmd/gotest)
        fi

        # gotest bench writes its own markdown to $GITHUB_STEP_SUMMARY
        # automatically (mirroring how `gotest summary --github` does it
        # above): results table, delta table, gate verdict. Under --json
        # the human rendering moves entirely into the step summary: stdout
        # carries the versioned report document, captured to a file.
        report="$(mktemp -t gotest-bench-XXXXXX.json)"
        args=(bench --spec --json)

        if [ -n "$INPUT_BENCH_BASELINE" ]; then
          args+=("--against=$INPUT_BENCH_BASELINE")
        fi

        if [ -n "$INPUT_BENCH_GATE" ]; then
          args+=("--gate=$INPUT_BENCH_GATE")
        fi

        # bench-save: "false" (the default) skips saving; an explicit empty
        # string becomes bare --save= (the bench.baseline config fallback);
        # anything else is the baseline path.
        if [ "$INPUT_BENCH_SAVE" != "false" ]; then
          args+=("--save=$INPUT_BENCH_SAVE")
        fi

        if [ -n "$INPUT_FLAGS" ]; then
          read -ra extra <<< "$INPUT_FLAGS"
          args+=("${extra[@]}")
        fi

        read -ra pkgs <<< "$INPUT_PACKAGES"
        args+=("${pkgs[@]}")

        set +e
        "${cmd[@]}" "${args[@]}" > "$report"
        exit_code=$?
        set -e

        echo "bench-report=$report" >> "$GITHUB_OUTPUT"

        # Comma-join gate.breachedKeys from the report without requiring
        # jq on the runner (python3 ships on all hosted images).
        breached=""
        if [ -s "$report" ]; then
          breached=$(python3 -c 'import json, sys; r = json.load(open(sys.argv[1])); g = r.get("gate") or {}; print(",".join(g.get("breachedKeys") or []), end="")' "$report" 2>/dev/null || true)
        fi
        echo "bench-breached-keys=$breached" >> "$GITHUB_OUTPUT"

        exit "$exit_code"
