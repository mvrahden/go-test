name: "Go - Test Suites"
description: "Run your test suites with a failure-focused summary, GitHub annotations, and coverage reporting"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  packages:
    description: "Package patterns to test"
    default: "./..."
  race:
    description: "Enable race detector"
    default: "false"
  coverage:
    description: "Enable coverage profiling and reporting"
    default: "false"
  min-coverage:
    description: "Minimum coverage percentage (0-100, fails if below)"
    required: false
  flags:
    description: "Additional gotest flags (--double-dash style)"
    required: false
  go-test-flags:
    description: "Additional go test flags (-single-dash style)"
    required: false
  badge:
    description: "Render a coverage badge and, on the default branch, publish it as coverage.svg to the badge-branch of this repository (needs contents: write). Turns coverage on."
    default: "false"
  badge-branch:
    description: "Branch the coverage badge is published to; created automatically on first use"
    default: "ci/badges"
  bench:
    description: "Run benchmarks after tests (gotest bench --spec)"
    default: "false"
  bench-baseline:
    description: "Baseline JSON file to compare benchmarks against (gotest bench --against)"
    required: false
  bench-gate:
    description: "Fail the run if any benchmark regresses by more than this percent (gotest bench --gate); needs -count=4 or more in flags"
    required: false
  bench-save:
    description: "Save the benchmark run as a JSON baseline at this path (gotest bench --save); an explicit empty string saves to bench.baseline from .gotest.yml"
    default: "false"
  fuzz:
    description: "Run a budgeted fuzz session after tests (gotest fuzz --for); a new crasher fails the step"
    default: "false"
  fuzz-for:
    description: "Approximate wall-clock budget for the whole fuzz session (gotest fuzz --for); empty uses the CLI's default of one minute"
    default: ""
  fuzz-cache:
    description: "Carry Go's fuzz cache (the inputs a session found interesting) between runs, so each session resumes where the last one stopped; set to false for a from-seeds run"
    default: "true"
  events-file:
    description: "Also save the run's go test -json event stream to this path, for upload-artifact, gotestsum or gotest summary --input; empty (the default) saves nothing. Prefer a path under runner.temp so it stays out of the checkout. Artifacts are not masked like logs: a token a test prints ends up in the file."
    default: ""
  audit:
    description: "After the tests, append gotest audit's comparison with the base commit to the step summary, with the run's stream as evidence and its coverage profile when it made one: auto (default) on pull_request events against the pull request's base, true also on other events against the pushed range's first parent (github.event.before), false never"
    default: "auto"
  audit-fail-on:
    description: "Finding classes the audit fails the step on (gotest audit --fail-on), comma-separated; empty (the default) reports and never fails"
    default: ""
  attest:
    description: "Attest the run's result with the in-toto test-result predicate through actions/attest, its subject the tested commit's source; the caller's job must grant id-token: write and attestations: write"
    default: "false"
  version:
    description: "gotest version: 'gomod' (default) runs the CLI go.mod declares; or a version tag such as v1.33.0 to install that binary. Pin the version go.mod requires: a binary that drifts from it is refused or runs the wrong runtime."
    default: "gomod"

outputs:
  exit-code:
    description: "Test process exit code"
    value: ${{ steps.test.outputs.exit-code }}
  coverage:
    description: "Coverage percentage (empty if coverage not enabled)"
    value: ${{ steps.test.outputs.coverage }}
  badge:
    description: "Path of the rendered coverage badge SVG (empty unless badge is enabled and the tests ran)"
    value: ${{ steps.test.outputs.badge }}
  events-file:
    description: "Absolute path of the saved event stream (empty unless events-file is set and the file was written)"
    value: ${{ steps.test.outputs.events-file }}
  audit-report:
    description: "Path of the audit's Markdown document (empty when the audit did not run)"
    value: ${{ steps.audit.outputs.audit-report }}
  attestation-url:
    description: "URL of the run's attestation (empty unless attest is enabled and it was made)"
    value: ${{ steps.attest.outputs.attestation-url }}
  bench-report:
    description: "Path to the gotest bench --json report file (empty if bench not enabled)"
    value: ${{ steps.bench.outputs.bench-report }}
  bench-breached-keys:
    description: "Comma-joined benchmark keys that breached the gate (empty if none or no gate)"
    value: ${{ steps.bench.outputs.bench-breached-keys }}
  fuzz-crashers:
    description: "Comma-joined workspace-relative paths of the corpus files the fuzz session added (empty if none or fuzz not enabled)"
    value: ${{ steps.fuzz.outputs.fuzz-crashers }}

runs:
  using: "composite"
  steps:
    - name: Install gotest
      if: ${{ inputs.version != 'gomod' }}
      shell: bash
      env:
        GOTEST_VERSION: ${{ inputs.version }}
      run: go install github.com/mvrahden/go-test/cmd/gotest@"$GOTEST_VERSION"

    - name: Resolve the gotest command
      id: resolve
      if: ${{ inputs.version == 'gomod' }}
      shell: bash
      run: |
        # The CLI is built once, from the module go.mod selects. Without a
        # declared tool its dependencies are resolved in a copy of go.mod, so
        # the checkout's go.sum stays as committed; workspace mode refuses
        # -modfile and needs neither flag.
        pkg=github.com/mvrahden/go-test/cmd/gotest
        notice="::notice title=gotest::go.mod does not declare the gotest tool; declare it with: go get -tool $pkg@<pinned version>"
        bin="${RUNNER_TEMP}/gotest-bin"
        exe="$bin/gotest"
        if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
        mkdir -p "$bin"
        build() {
          mkdir -p "$bin"
          if ! go build "$@" -o "$exe" "$pkg"; then
            echo "::error title=gotest::could not build $pkg as go.mod selects it; run go mod tidy, or declare the tool with: go get -tool $pkg@<pinned version>"
            exit 2
          fi
          echo "GOTEST_BIN=$exe" >> "$GITHUB_ENV"
        }
        # Read from go.mod, of every use module in a workspace: the go tool
        # listing differs between Go releases.
        declared=
        while IFS= read -r gomod; do
          json=$(go mod edit -json "$gomod" 2>/dev/null) || continue
          case "$json" in *"\"Path\": \"$pkg\""*) declared=1 ;; esac
        done < <(go list -m -f '{{.GoMod}}' 2>/dev/null)
        if [ -n "$declared" ]; then
          build
        elif [ -n "$(go env GOWORK)" ]; then
          go list -m 2>/dev/null | grep -qx github.com/mvrahden/go-test || echo "$notice"
          build
        else
          echo "$notice"
          cp go.mod "$bin/go.mod"
          if [ -f go.sum ]; then cp go.sum "$bin/go.sum"; fi
          build -mod=mod -modfile="$bin/go.mod"
        fi

    - name: Run tests
      id: test
      shell: bash
      env:
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_RACE: ${{ inputs.race }}
        INPUT_COVERAGE: ${{ inputs.coverage }}
        INPUT_MIN_COVERAGE: ${{ inputs.min-coverage }}
        INPUT_FLAGS: ${{ inputs.flags }}
        INPUT_GO_TEST_FLAGS: ${{ inputs.go-test-flags }}
        INPUT_BADGE: ${{ inputs.badge }}
        INPUT_EVENTS_FILE: ${{ inputs.events-file }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_AUDIT: ${{ inputs.audit }}
        INPUT_ATTEST: ${{ inputs.attest }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ "$INPUT_VERSION" != "gomod" ]; then
          cmd=(gotest)
        else
          cmd=("$GOTEST_BIN")
        fi

        audit="${INPUT_AUDIT:-auto}"
        case "$audit" in auto | true | false) ;; *)
          echo "::error::audit must be auto, true or false; got ${audit}"; exit 2;;
        esac
        want_audit=""
        if [ "$audit" = "true" ] || { [ "$audit" = "auto" ] && [ "$EVENT_NAME" = "pull_request" ]; }; then
          want_audit=1
        fi

        args=(summary --github)

        # The help is read whole: grep -q would close the pipe early, and
        # pipefail turns the CLI's broken pipe into a failed probe.
        summary_help=""
        if [ -n "$INPUT_EVENTS_FILE" ] || [ -n "$want_audit" ] || [ "$INPUT_ATTEST" = "true" ]; then
          summary_help="$("${cmd[@]}" summary --help 2>/dev/null || true)"
        fi

        events_file=""
        if [ -n "$INPUT_EVENTS_FILE" ]; then
          if [[ "$summary_help" != *--events-file* ]]; then
            have="$INPUT_VERSION"
            if [ "$have" = "gomod" ]; then
              have="$(go list -m -f '{{.Version}}' github.com/mvrahden/go-test 2>/dev/null || true)"
              echo "::error::events-file needs gotest v1.36.0 or newer; go.mod pins ${have:-an older version}"
            else
              echo "::error::events-file needs gotest v1.36.0 or newer; the version input is ${have}"
            fi
            exit 2
          fi
          events_file="$INPUT_EVENTS_FILE"
          case "$events_file" in
            /* | [A-Za-z]:[\\/]*) ;;
            *) events_file="$PWD/$events_file" ;;
          esac
          if command -v cygpath > /dev/null; then
            events_file="$(cygpath -m "$events_file")"
          fi
          rm -f "$events_file"
          args+=("--events-file=$events_file")
        fi

        # The audit and the attestation read the run's stream: one is kept
        # in RUNNER_TEMP when the caller keeps none and the CLI can write it.
        stream="$events_file"
        if [ -z "$stream" ] && { [ -n "$want_audit" ] || [ "$INPUT_ATTEST" = "true" ]; } &&
          [[ "$summary_help" == *--events-file* ]]; then
          stream="${RUNNER_TEMP}/gotest-run-events.json"
          if command -v cygpath > /dev/null; then
            stream="$(cygpath -m "$stream")"
          fi
          rm -f "$stream"
          args+=("--events-file=$stream")
        fi

        gtflags=()
        if [ -n "$INPUT_GO_TEST_FLAGS" ]; then
          case "$INPUT_GO_TEST_FLAGS" in *\"*|*\'*)
            echo "::error::go-test-flags must not contain quotes: one entry per word or line"; exit 2;;
          esac
          read -r -d '' -a gtflags <<< "$INPUT_GO_TEST_FLAGS" || true
        fi

        # A -coverprofile the caller passes through go-test-flags is the
        # run's profile; the action only adds a temporary one when nobody did.
        user_profile=""
        for ((i = 0; i < ${#gtflags[@]}; i++)); do
          case "${gtflags[i]}" in
            -coverprofile=*) user_profile="${gtflags[i]#-coverprofile=}" ;;
            -coverprofile) user_profile="${gtflags[i+1]:-}" ;;
          esac
        done

        cover_profile=""
        temp_profile=""
        if [ "$INPUT_COVERAGE" = "true" ] || [ "$INPUT_BADGE" = "true" ]; then
          if [ -n "$user_profile" ]; then
            cover_profile="$user_profile"
          elif [ -n "$want_audit" ]; then
            cover_profile="${RUNNER_TEMP}/gotest-cover.out"
            rm -f "$cover_profile"
            args+=("-coverprofile=$cover_profile")
          else
            cover_profile="$(mktemp -t gotest-cover-XXXXXX.out)"
            temp_profile="$cover_profile"
          fi
          args+=("--coverage=$cover_profile")
        fi

        badge_file=""
        if [ "$INPUT_BADGE" = "true" ]; then
          badge_file="${RUNNER_TEMP}/gotest-coverage-badge.svg"
          rm -f "$badge_file"
          args+=("--badge=$badge_file")
        fi

        if [ -n "$INPUT_MIN_COVERAGE" ]; then
          args+=("--min=$INPUT_MIN_COVERAGE")
        fi

        if [ -n "$INPUT_FLAGS" ]; then
          case "$INPUT_FLAGS" in *\"*|*\'*)
            echo "::error::flags must not contain quotes: one entry per word or line"; exit 2;;
          esac
          read -r -d '' -a extra <<< "$INPUT_FLAGS" || true
          args+=("${extra[@]}")
        fi

        case "$INPUT_PACKAGES" in *\"*|*\'*)
          echo "::error::packages must not contain quotes: one entry per word or line"; exit 2;;
        esac
        read -r -d '' -a pkgs <<< "$INPUT_PACKAGES" || true
        args+=("${pkgs[@]}")

        if [ "$INPUT_RACE" = "true" ]; then
          args+=(-race)
        fi

        if [ -n "$temp_profile" ]; then
          args+=("-coverprofile=$temp_profile")
        fi

        if [ ${#gtflags[@]} -gt 0 ]; then
          args+=("${gtflags[@]}")
        fi

        set +e
        if [ "$RUNNER_OS" = "Windows" ]; then
          "${cmd[@]}" "${args[@]}"
          exit_code=$?
        else
          # A cancelled job signals this shell alone: pass it on to gotest's process group, as a terminal does.
          trap 'kill -INT -- -"$pid" 2>/dev/null || kill -INT "$pid" 2>/dev/null' INT
          trap 'kill -TERM -- -"$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null' TERM
          set -m
          "${cmd[@]}" "${args[@]}" < /dev/null &
          pid=$!
          set +m
          while :; do
            wait "$pid"; exit_code=$?
            kill -0 "$pid" 2>/dev/null || break
          done
          trap - INT TERM
        fi
        set -e

        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"

        if [ -n "$cover_profile" ] && [ -f "$cover_profile" ]; then
          # A profile go tool cover rejects must not fail a step whose tests
          # already have their verdict; the coverage output just stays empty.
          if cov=$(go tool cover -func="$cover_profile" | tail -1 | awk '{print $NF}' | sed 's/%//'); then
            echo "coverage=$cov" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not compute the coverage output from ${cover_profile}"
          fi
          [ -n "$temp_profile" ] && rm -f "$temp_profile"
        fi

        if [ -n "$badge_file" ] && [ -f "$badge_file" ]; then
          echo "badge=$badge_file" >> "$GITHUB_OUTPUT"
        fi

        if [ -n "$events_file" ] && [ -f "$events_file" ]; then
          echo "events-file=$events_file" >> "$GITHUB_OUTPUT"
        fi

        if [ -n "$stream" ] && [ -f "$stream" ]; then
          echo "stream=$stream" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$want_audit" ] && [ -n "$cover_profile" ] && [ -f "$cover_profile" ]; then
          echo "profile=$cover_profile" >> "$GITHUB_OUTPUT"
        fi

        exit "$exit_code"

    - name: Audit the change
      id: audit
      if: ${{ !cancelled() && inputs.audit != 'false' && steps.test.outputs.exit-code != '' }}
      shell: bash
      env:
        INPUT_AUDIT: ${{ inputs.audit }}
        INPUT_AUDIT_FAIL_ON: ${{ inputs.audit-fail-on }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_VERSION: ${{ inputs.version }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        STREAM: ${{ steps.test.outputs.stream }}
        PROFILE: ${{ steps.test.outputs.profile }}
      run: |
        if [ "$INPUT_VERSION" != "gomod" ]; then
          cmd=(gotest)
        else
          cmd=("$GOTEST_BIN")
        fi

        skip() {
          echo "gotest audit skipped: $1"
          printf '\n> gotest audit skipped: %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        }

        if [ "${INPUT_AUDIT:-auto}" = "auto" ] && [ "$EVENT_NAME" != "pull_request" ]; then
          exit 0
        fi
        base="${PR_BASE:-$PUSH_BEFORE}"
        case "$base" in "" | *[!0]*) ;; *) base="" ;; esac
        if [ -z "$base" ]; then
          skip "the ${EVENT_NAME:-unknown} event names no base commit"
        fi
        # Read whole, as the test step reads summary's help.
        audit_help="$("${cmd[@]}" audit --help 2>/dev/null || true)"
        if [[ "$audit_help" != *--evidence* ]]; then
          skip "the gotest in use has no audit command that reads a run's stream"
        fi

        # A shallow checkout lacks the base: fetch that one commit.
        log="${RUNNER_TEMP}/gotest-audit-fetch.log"
        if ! git cat-file -e "${base}^{commit}" 2>/dev/null &&
          ! git fetch --no-tags --quiet --depth=1 origin "$base" > "$log" 2>&1; then
          cat "$log"
          skip "the base commit ${base} could not be fetched"
        fi

        report="${RUNNER_TEMP}/gotest-audit.md"
        args=(audit "--base=$base" --format=md "--output=$report")
        if [ -n "$STREAM" ] && [ -f "$STREAM" ]; then
          args+=("--evidence=$STREAM")
        fi
        if [ -n "$PROFILE" ] && [ -f "$PROFILE" ]; then
          args+=("--coverage=$PROFILE")
        fi
        if [ -n "$INPUT_AUDIT_FAIL_ON" ]; then
          args+=("--fail-on=$INPUT_AUDIT_FAIL_ON")
        fi
        case "$INPUT_PACKAGES" in *\"*|*\'*)
          echo "::error::packages must not contain quotes: one entry per word or line"; exit 2;;
        esac
        read -r -d '' -a pkgs <<< "$INPUT_PACKAGES" || true
        args+=("${pkgs[@]}")

        set +e
        "${cmd[@]}" "${args[@]}"
        code=$?
        set -e
        if [ -s "$report" ]; then
          { echo; cat "$report"; } >> "$GITHUB_STEP_SUMMARY"
          echo "audit-report=$report" >> "$GITHUB_OUTPUT"
        fi

        # Only a policy the caller set fails the step.
        if [ "$code" -ne 0 ] && [ -n "$INPUT_AUDIT_FAIL_ON" ]; then
          exit "$code"
        fi
        if [ "$code" -ne 0 ]; then
          echo "::warning title=gotest audit::gotest audit exited ${code}; its report says why"
        fi
        exit 0

    - name: Write the test-result predicate
      id: predicate
      if: ${{ !cancelled() && inputs.attest == 'true' && steps.test.outputs.exit-code != '' }}
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        STREAM: ${{ steps.test.outputs.stream }}
      run: |
        if [ "$INPUT_VERSION" != "gomod" ]; then
          cmd=(gotest)
        else
          cmd=("$GOTEST_BIN")
        fi

        skip() {
          echo "::warning title=gotest attest::attestation skipped: $1"
          printf '\n> gotest attestation skipped: %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        }

        if [ -z "$STREAM" ] || [ ! -f "$STREAM" ]; then
          skip "the run saved no event stream"
        fi
        predicate="${RUNNER_TEMP}/gotest-test-result.json"
        if ! "${cmd[@]}" summary "--input=$STREAM" --format=intoto-test-result "--output=$predicate"; then
          skip "the gotest in use cannot write the test-result predicate"
        fi

        # The subject is the tested commit's source: actions/attest takes
        # SHA-2 digests only, so it is the sha256 of git archive's tar of
        # the commit, which a verifier recomputes from the commit.
        if ! commit=$(git rev-parse --verify HEAD 2>/dev/null); then
          skip "the workspace is not a git checkout"
        fi
        if command -v sha256sum > /dev/null; then
          sum=(sha256sum)
        else
          sum=(shasum -a 256)
        fi
        digest=$(git archive --format=tar "$commit" | "${sum[@]}" | cut -d' ' -f1)
        {
          echo "path=$predicate"
          echo "subject-name=git+${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}@${commit}"
          echo "subject-digest=sha256:$digest"
        } >> "$GITHUB_OUTPUT"

    - name: Attest the run
      id: attest
      if: ${{ !cancelled() && steps.predicate.outputs.path != '' }}
      continue-on-error: true
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-name: ${{ steps.predicate.outputs.subject-name }}
        subject-digest: ${{ steps.predicate.outputs.subject-digest }}
        predicate-type: https://in-toto.io/attestation/test-result/v0.1
        predicate-path: ${{ steps.predicate.outputs.path }}

    - name: Report a failed attestation
      if: ${{ !cancelled() && steps.attest.outcome == 'failure' }}
      shell: bash
      run: |
        msg="the run was not attested: does the job grant id-token: write and attestations: write? A pull request from a fork gets neither."
        echo "::warning title=gotest attest::$msg"
        printf '\n> gotest attestation failed: %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"

    # The badge follows the default branch only: a pull request or feature
    # branch must never rewrite it. Exit code 2 means the suites did not run
    # to completion (build failure, bad invocation), so there is nothing
    # trustworthy to publish; 0 and 1 (tests failed or the minimum was
    # missed) still describe the real coverage of the branch.
    - name: Publish coverage badge
      if: ${{ !cancelled() && inputs.badge == 'true' && steps.test.outputs.badge != '' && steps.test.outputs.exit-code != '2' }}
      shell: bash
      env:
        BADGE_FILE: ${{ steps.test.outputs.badge }}
        BADGE_BRANCH: ${{ inputs.badge-branch }}
        COVERAGE: ${{ steps.test.outputs.coverage }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -z "$DEFAULT_BRANCH" ] && command -v gh >/dev/null 2>&1; then
          DEFAULT_BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch 2>/dev/null || true)
        fi
        if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
          echo "Coverage badge is published from ${DEFAULT_BRANCH:-the default branch} only; skipping on ${GITHUB_REF}"
          exit 0
        fi

        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        work="${RUNNER_TEMP}/gotest-badge-publish"
        trap 'rm -rf "$work"' EXIT

        # Each attempt starts from the branch's current tip, so a concurrent
        # job's push (e.g. another matrix cell) only costs a retry.
        for attempt in 1 2 3; do
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work" || exit 1
          git init -q
          git remote add origin "$remote"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch -q --depth 1 origin "refs/heads/${BADGE_BRANCH}" 2>/dev/null; then
            git checkout -q -B "$BADGE_BRANCH" FETCH_HEAD
          else
            git checkout -q --orphan "$BADGE_BRANCH"
          fi

          cp "$BADGE_FILE" coverage.svg
          {
            echo "# ${BADGE_BRANCH}"
            echo
            echo "Files on this branch are written by the gotest GitHub Action (\`badge: true\`); edits are overwritten on the next run."
            echo
            echo "![Coverage](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BADGE_BRANCH}/coverage.svg)"
          } > README.md

          git add -A
          if git diff --cached --quiet; then
            echo "Coverage badge unchanged (${COVERAGE}%)"
            exit 0
          fi
          git commit -q -m "coverage: ${COVERAGE}%"
          if git push -q origin "HEAD:refs/heads/${BADGE_BRANCH}" 2>push.log; then
            echo "Coverage badge published: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BADGE_BRANCH}/coverage.svg"
            exit 0
          fi
          echo "push attempt ${attempt} failed:"
          cat push.log
          sleep "$attempt"
        done

        echo "::warning::Coverage badge not published: could not push to ${BADGE_BRANCH}. Does the job grant 'contents: write'?"
        exit 0

    - name: Run benchmarks
      id: bench
      if: ${{ inputs.bench == 'true' }}
      shell: bash
      env:
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_BENCH_BASELINE: ${{ inputs.bench-baseline }}
        INPUT_BENCH_GATE: ${{ inputs.bench-gate }}
        INPUT_BENCH_SAVE: ${{ inputs.bench-save }}
        INPUT_FLAGS: ${{ inputs.flags }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$INPUT_VERSION" != "gomod" ]; then
          cmd=(gotest)
        else
          cmd=("$GOTEST_BIN")
        fi

        # gotest bench writes its own markdown to $GITHUB_STEP_SUMMARY
        # automatically (mirroring how `gotest summary --github` does it
        # above): results table, delta table, gate verdict. Under --json
        # the human rendering moves entirely into the step summary: stdout
        # carries the versioned report document, captured to a file.
        report="$(mktemp -t gotest-bench-XXXXXX.json)"
        args=(bench --spec --json)

        if [ -n "$INPUT_BENCH_BASELINE" ]; then
          args+=("--against=$INPUT_BENCH_BASELINE")
        fi

        if [ -n "$INPUT_BENCH_GATE" ]; then
          args+=("--gate=$INPUT_BENCH_GATE")
        fi

        # bench-save: "false" (the default) skips saving; an explicit empty
        # string becomes bare --save= (the bench.baseline config fallback);
        # anything else is the baseline path.
        if [ "$INPUT_BENCH_SAVE" != "false" ]; then
          args+=("--save=$INPUT_BENCH_SAVE")
        fi

        if [ -n "$INPUT_FLAGS" ]; then
          case "$INPUT_FLAGS" in *\"*|*\'*)
            echo "::error::flags must not contain quotes: one entry per word or line"; exit 2;;
          esac
          read -r -d '' -a extra <<< "$INPUT_FLAGS" || true
          args+=("${extra[@]}")
        fi

        case "$INPUT_PACKAGES" in *\"*|*\'*)
          echo "::error::packages must not contain quotes: one entry per word or line"; exit 2;;
        esac
        read -r -d '' -a pkgs <<< "$INPUT_PACKAGES" || true
        args+=("${pkgs[@]}")

        set +e
        if [ "$RUNNER_OS" = "Windows" ]; then
          "${cmd[@]}" "${args[@]}" > "$report"
          exit_code=$?
        else
          trap 'kill -INT -- -"$pid" 2>/dev/null || kill -INT "$pid" 2>/dev/null' INT
          trap 'kill -TERM -- -"$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null' TERM
          set -m
          "${cmd[@]}" "${args[@]}" > "$report" < /dev/null &
          pid=$!
          set +m
          while :; do
            wait "$pid"; exit_code=$?
            kill -0 "$pid" 2>/dev/null || break
          done
          trap - INT TERM
        fi
        set -e

        echo "bench-report=$report" >> "$GITHUB_OUTPUT"

        # Comma-join gate.breachedKeys from the report without requiring
        # jq on the runner (python3 ships on all hosted images).
        breached=""
        if [ -s "$report" ]; then
          breached=$(python3 -c 'import json, sys; r = json.load(open(sys.argv[1])); g = r.get("gate") or {}; print(",".join(g.get("breachedKeys") or []), end="")' "$report" 2>/dev/null || true)
        fi
        echo "bench-breached-keys=$breached" >> "$GITHUB_OUTPUT"

        exit "$exit_code"

    # Go keeps the inputs a session found interesting in its build cache.
    # setup-go's cache is keyed on go.sum and never re-saved on a hit, so a
    # corpus would only survive a dependency bump; this pair restores the
    # latest corpus of the branch or its base and saves this run's under a
    # key of its own, so a short budget compounds across runs.
    - name: Locate the Go fuzz cache
      id: fuzz-cache-dir
      if: ${{ inputs.fuzz == 'true' && inputs.fuzz-cache == 'true' }}
      shell: bash
      run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

    - name: Restore the fuzz cache
      if: ${{ inputs.fuzz == 'true' && inputs.fuzz-cache == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.fuzz-cache-dir.outputs.dir }}
        key: gotest-fuzz-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: gotest-fuzz-${{ runner.os }}-

    - name: Run fuzz session
      id: fuzz
      if: ${{ inputs.fuzz == 'true' }}
      shell: bash
      env:
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_FUZZ_FOR: ${{ inputs.fuzz-for }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$INPUT_VERSION" != "gomod" ]; then
          cmd=(gotest)
        else
          cmd=("$GOTEST_BIN")
        fi

        # gotest fuzz writes its own session table to $GITHUB_STEP_SUMMARY.
        # The session exits 1 on a finding and 0 when the budget ran out
        # with nothing found; the crasher files it names stay in the
        # checkout for a later upload-artifact step or `gotest fuzz promote`.
        log="$(mktemp -t gotest-fuzz-XXXXXX.log)"
        case "$INPUT_PACKAGES" in *\"*|*\'*)
          echo "::error::packages must not contain quotes: one entry per word or line"; exit 2;;
        esac
        pkgs=()
        read -r -d '' -a pkgs <<< "$INPUT_PACKAGES" || true

        set +e
        args=(fuzz)
        if [ -n "$INPUT_FUZZ_FOR" ]; then
          args+=("--for=$INPUT_FUZZ_FOR")
        fi
        if [ "$RUNNER_OS" = "Windows" ]; then
          "${cmd[@]}" "${args[@]}" "${pkgs[@]}" 2>&1 | tee "$log"
          exit_code=${PIPESTATUS[0]}
        else
          fifo="$log.fifo"
          mkfifo "$fifo"
          tee "$log" < "$fifo" &
          tee_pid=$!
          trap 'kill -INT -- -"$pid" 2>/dev/null || kill -INT "$pid" 2>/dev/null' INT
          trap 'kill -TERM -- -"$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null' TERM
          set -m
          "${cmd[@]}" "${args[@]}" "${pkgs[@]}" > "$fifo" 2>&1 < /dev/null &
          pid=$!
          set +m
          while :; do
            wait "$pid"; exit_code=$?
            kill -0 "$pid" 2>/dev/null || break
          done
          trap - INT TERM
          wait "$tee_pid"
          rm -f "$fifo"
        fi
        set -e

        crashers=$(sed -n 's/^\[[^]]*\] new crasher: //p' "$log" | python3 -c 'import os, sys; print(",".join(os.path.relpath(p.strip()) for p in sys.stdin if p.strip()), end="")')
        echo "fuzz-crashers=$crashers" >> "$GITHUB_OUTPUT"

        exit "$exit_code"

    - name: Save the fuzz cache
      if: ${{ always() && inputs.fuzz == 'true' && inputs.fuzz-cache == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.fuzz-cache-dir.outputs.dir }}
        key: gotest-fuzz-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
