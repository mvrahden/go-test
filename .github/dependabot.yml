version: 2

# golang.org/x/tools and golangci-lint are not ordinary dependencies: each
# embeds a copy of the compiler's type system, so a pin that drifts behind the
# Go version CI tests stops being able to read what that Go writes. Keeping
# them current is the only real defence, so let a bot do it.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns:
          - golang.org/x/*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
