name: test

on:
  # main is tested after merge too: a direct push, or a merge result that no
  # pull request ever built, otherwise reaches a release unverified.
  push:
    branches: [main]
    paths-ignore: [vscode-gotest/**]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: [vscode-gotest/**]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Test (suites)
        uses: ./
        with:
          packages: "./... ./examples/..."
          race: true

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Bench (examples, single iteration)
        uses: ./
        with:
          packages: "./examples/..."
          bench: "true"
          flags: "-benchtime=1x"

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Fuzz (examples, ten seconds)
        uses: ./
        with:
          packages: "./examples/..."
          fuzz: "true"
          fuzz-for: "10s"

  test:
    runs-on: ubuntu-latest
    # The coverage badge is pushed to ci/badges; the action publishes it from
    # main only, so pull-request runs never use the write scope.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      # gotest tests itself with one runner. The census, the ring-0 suites,
      # the canary and the drill (quality.yml) replace the stdlib step; see
      # ARCHITECTURE.md, "Testing gotest".
      - name: Test (suites)
        uses: ./
        with:
          packages: "./... ./examples/..."
          race: true
          min-coverage: 70
          # One matrix cell publishes the badge; the others would only race
          # it for the same number.
          badge: ${{ matrix.go-version == '1.27' }}
