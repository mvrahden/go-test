name: test

on:
  # main is tested after merge too: a direct push, or a merge result that no
  # pull request ever built, otherwise reaches a release unverified.
  # Two Go suites read files under vscode-gotest/ (runtimeversion_suite_test.go
  # pins MIN_CLI_VERSION to the runtime floor; runfailure_suite_test.go uses
  # testdata/teardownfail), so those paths come back in after the exclusion:
  # later patterns win.
  push:
    branches: [main]
    paths:
      - "**"
      - "!vscode-gotest/**"
      - "!site/**"
      - vscode-gotest/src/cli.ts
      - "vscode-gotest/testdata/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**"
      - "!vscode-gotest/**"
      - "!site/**"
      - vscode-gotest/src/cli.ts
      - "vscode-gotest/testdata/**"

# A superseded pull-request run is waste; a superseded main run is a commit
# that never got its verdict.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - name: Test (suites)
        uses: ./
        with:
          packages: "./... ./examples/..."
          race: true

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - name: Bench (examples, single iteration)
        uses: ./
        with:
          packages: "./examples/..."
          bench: "true"
          flags: "-benchtime=1x"

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - name: Fuzz (examples, ten seconds)
        uses: ./
        with:
          packages: "./examples/..."
          fuzz: "true"
          fuzz-for: "10s"

  test:
    runs-on: ubuntu-latest
    # The coverage badge is pushed to ci/badges; the action publishes it from
    # main only, so pull-request runs never use the write scope.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
      # gotest tests itself with one runner. The census, the ring-0 suites,
      # the canary and the drill (quality.yml) replace the stdlib step; see
      # ARCHITECTURE.md, "Testing gotest".
      - name: Test (suites)
        uses: ./
        with:
          packages: "./... ./examples/..."
          race: true
          min-coverage: 70
          # One matrix cell publishes the badge; the others would only race
          # it for the same number.
          badge: ${{ matrix.go-version == '1.27' }}
