name: test

on:
  # main is tested after merge too: a direct push, or a merge result that no
  # pull request ever built, otherwise reaches a release unverified.
  push:
    branches: [main]
    paths:
      - "**"
      - "!vscode-gotest/**"
      - "!site/**"
      - vscode-gotest/src/cli.ts
      - "vscode-gotest/testdata/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**"
      - "!vscode-gotest/**"
      - "!site/**"
      - vscode-gotest/src/cli.ts
      - "vscode-gotest/testdata/**"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        shard: [cli, core]
        include:
          - os: windows-latest
            timeout-scale: 3
          - os: macos-latest
            parallel: 6
            timeout-scale: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
        with:
          cache-key: platform-test-${{ matrix.shard }}
      - name: Select the shard's packages
        id: shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cli='^github\.com/mvrahden/go-test/(cmd|tests)(/|$)'
          if [ "$SHARD" = cli ]; then sel=(grep -E); else sel=(grep -vE); fi
          pkgs=$(go list ./... ./examples/... | "${sel[@]}" "$cli" | tr '\n' ' ')
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
      - name: Test (suites)
        id: test
        uses: ./
        env:
          GOTEST_TIMEOUT_SCALE: ${{ matrix.timeout-scale }}
        with:
          packages: ${{ steps.shard.outputs.packages }}
          race: true
          flags: "--parallel=${{ matrix.parallel || env.GATE_PARALLEL }} --timeout=${{ env.GATE_PLATFORM_TIMEOUT }}"
          events-file: ${{ runner.temp }}/test-events.json
      - name: Upload the test event stream
        if: ${{ always() && steps.test.outputs.events-file != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-events-${{ runner.os }}-${{ matrix.shard }}
          path: ${{ steps.test.outputs.events-file }}
          retention-days: 14
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache

  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
      - name: Bench (examples, single iteration)
        uses: ./
        with:
          packages: "./examples/..."
          bench: "true"
          flags: "-benchtime=1x"

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
      - name: Fuzz (examples, ten seconds)
        uses: ./
        with:
          packages: "./examples/..."
          fuzz: "true"
          fuzz-for: "10s"

  action-consumer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        tool: [declared, undeclared]
        include:
          - os: windows-latest
            tool: declared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: gotest
      - name: Stage a consumer module at the workspace root
        id: stage
        shell: bash
        run: |
          cp -R gotest/tests/skillevals/writing-gotest-tests/consumer-fixture/. .
          rm -f go.work go.work.sum
          go_line=$(sed -n 's/^go //p' go.mod)
          echo "go-version=$go_line" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ steps.stage.outputs.go-version }}
          cache: false
      - name: Point the consumer at this checkout
        shell: bash
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          go mod edit -replace github.com/mvrahden/go-test=./gotest
          if [ "$TOOL" = undeclared ]; then
            go mod edit -droptool github.com/mvrahden/go-test/cmd/gotest
            go mod tidy
          fi
          cp go.sum "$RUNNER_TEMP/go.sum.before"
      - name: Test (the consumer, through the action)
        id: green
        uses: ./gotest
        with:
          coverage: true
          go-test-flags: -short
      - name: The run was green and left go.sum alone
        shell: bash
        env:
          EXIT_CODE: ${{ steps.green.outputs.exit-code }}
          COVERAGE: ${{ steps.green.outputs.coverage }}
        run: |
          test "$EXIT_CODE" = 0
          test -n "$COVERAGE"
          cmp go.sum "$RUNNER_TEMP/go.sum.before"
      - name: Break one package
        shell: bash
        run: printf 'package pricing\n\nvar _ = undefined\n' > pricing/zz_broken.go
      - name: Test (a package that does not build)
        id: red
        continue-on-error: true
        uses: ./gotest
      - name: A build failure is exit code 2
        shell: bash
        env:
          EXIT_CODE: ${{ steps.red.outputs.exit-code }}
          OUTCOME: ${{ steps.red.outcome }}
        run: |
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 2

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The coverage badge is pushed to ci/badges; the action publishes it from
    # main only, so pull-request runs never use the write scope.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        go: [min, pinned]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          go: ${{ matrix.go }}
      # gotest tests itself with one runner. The census, the ring-0 suites,
      # the canary and the drill (quality.yml) replace the stdlib step; see
      # ARCHITECTURE.md, "Testing gotest".
      - name: Test (suites)
        id: test
        uses: ./
        with:
          packages: "./... ./examples/..."
          race: true
          min-coverage: ${{ env.GATE_MIN_COVERAGE }}
          # One matrix cell publishes the badge; the others would only race
          # it for the same number.
          badge: ${{ matrix.go == 'pinned' }}
          flags: "--parallel=${{ env.GATE_PARALLEL }} --timeout=${{ env.GATE_TIMEOUT }}"
          events-file: ${{ runner.temp }}/test-events.json
      - name: Upload the test event stream
        if: ${{ always() && steps.test.outputs.events-file != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-events-${{ runner.os }}-go-${{ matrix.go }}
          path: ${{ steps.test.outputs.events-file }}
          retention-days: 14
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
