name: test

on:
  # main is tested after merge too: a direct push, or a merge result that no
  # pull request ever built, otherwise reaches a release unverified.
  push:
    branches: [main]
    paths:
      - "**"
      - "!vscode-gotest/**"
      - "!site/**"
      - vscode-gotest/src/cli.ts
      - "vscode-gotest/testdata/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**"
      - "!vscode-gotest/**"
      - "!site/**"
      - vscode-gotest/src/cli.ts
      - "vscode-gotest/testdata/**"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        shard: [cli, core]
        include:
          - os: macos-latest
            parallel: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
        with:
          cache-key: platform-test-${{ matrix.shard }}
      - name: Select the shard's packages
        id: shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cli='^github\.com/mvrahden/go-test/(cmd|tests)(/|$)'
          if [ "$SHARD" = cli ]; then sel=(grep -E); else sel=(grep -vE); fi
          pkgs=$(go list ./... ./examples/... | "${sel[@]}" "$cli" | tr '\n' ' ')
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
      - name: Test (suites)
        id: test
        uses: ./
        with:
          packages: ${{ steps.shard.outputs.packages }}
          race: true
          flags: "--parallel=${{ matrix.parallel || env.GATE_PARALLEL }}"
          events-file: ${{ runner.temp }}/test-events.json
      - name: Upload the test event stream
        if: ${{ always() && steps.test.outputs.events-file != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-events-${{ runner.os }}-${{ matrix.shard }}
          path: ${{ steps.test.outputs.events-file }}
          retention-days: 14
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache

  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
      - name: Bench (examples, single iteration)
        uses: ./
        with:
          packages: "./examples/..."
          bench: "true"
          flags: "-benchtime=1x"

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
      - name: Fuzz (examples, ten seconds)
        uses: ./
        with:
          packages: "./examples/..."
          fuzz: "true"
          fuzz-for: "10s"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The coverage badge is pushed to ci/badges; the action publishes it from
    # main only, so pull-request runs never use the write scope.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        go: [min, pinned]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
        with:
          go: ${{ matrix.go }}
      # gotest tests itself with one runner. The census, the ring-0 suites,
      # the canary and the drill (quality.yml) replace the stdlib step; see
      # ARCHITECTURE.md, "Testing gotest".
      - name: Test (suites)
        uses: ./
        with:
          packages: "./... ./examples/..."
          race: true
          min-coverage: ${{ env.GATE_MIN_COVERAGE }}
          # One matrix cell publishes the badge; the others would only race
          # it for the same number.
          badge: ${{ matrix.go == 'pinned' }}
          flags: "--parallel=${{ env.GATE_PARALLEL }}"
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
