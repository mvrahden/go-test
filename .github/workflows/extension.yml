name: extension

on:
  push:
    branches: [main]
    paths: [vscode-gotest/**]
  pull_request:
    paths: [vscode-gotest/**]

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vscode-gotest

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/extension-check
        with:
          format: ${{ matrix.os == 'ubuntu-latest' }}

  package:
    # One artifact, and it is platform-independent.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-gotest/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-gotest-vsix
          path: vscode-gotest/*.vsix
