name: extension

on:
  push:
    branches: [main]
    paths: [vscode-gotest/**, .github/actions/extension-check/**, .github/workflows/extension.yml]
  pull_request:
    paths: [vscode-gotest/**, .github/actions/extension-check/**, .github/workflows/extension.yml]

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vscode-gotest

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/extension-check
        with:
          format: ${{ matrix.os == 'ubuntu-latest' }}

  package:
    # One artifact, and it is platform-independent.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-gotest/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vscode-gotest-vsix
          path: vscode-gotest/*.vsix
