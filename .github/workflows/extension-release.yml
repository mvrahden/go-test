name: extension-release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      OPENVSX_TOKEN:
        required: true

concurrency:
  group: extension-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: vscode-gotest

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/extension-check

  package:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-gotest/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: Set version from release tag
        run: npm version "${TAG#v}" --no-git-tag-version
        env:
          TAG: ${{ inputs.tag }}
      - run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vsix
          path: vscode-gotest/*.vsix

  publish-github:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix
      - name: Upload .vsix to release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" *.vsix --clobber

  publish-marketplace:
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 30
    permissions:
      id-token: write
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=mvrahden.gotest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix
      - name: Require the marketplace identity
        working-directory: .
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: test -n "$AZURE_CLIENT_ID" -a -n "$AZURE_TENANT_ID" || { echo "::error::repository variables AZURE_CLIENT_ID and AZURE_TENANT_ID must name the Entra identity that publishes to the marketplace"; exit 1; }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to the marketplace, retrying gallery timeouts
        working-directory: .
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for attempt in 1 2 3 4 5; do
            if npx @vscode/vsce publish --azure-credential --no-dependencies --skip-duplicate --packagePath *.vsix 2>&1 | tee publish.log; then
              exit 0
            fi
            grep -q "Request timeout" publish.log || exit 1
            [ "$attempt" -lt 5 ] || break
            delay=$((attempt * 30))
            echo "::warning::marketplace publish attempt $attempt timed out; retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::marketplace publish timed out 5 times; the runner-to-marketplace path is the usual culprit. Download the vsix with gh release download \"$TAG\" -p '*.vsix' and upload it at https://marketplace.visualstudio.com/manage/publishers/mvrahden"
          exit 1

  publish-openvsx:
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 15
    environment:
      name: open-vsx
      url: https://open-vsx.org/extension/mvrahden/gotest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix
      - name: Require an Open VSX token
        working-directory: .
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}
        run: test -n "$OVSX_PAT" || { echo "::error::OVSX_PAT is empty — the token never reached this job"; exit 1; }
      - working-directory: .
        run: npx ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}
