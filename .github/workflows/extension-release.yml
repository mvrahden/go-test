name: extension-release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      MARKETPLACE_TOKEN:
        required: true
      OPENVSX_TOKEN:
        required: true

concurrency:
  group: extension-release
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: vscode-gotest

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/extension-check

  package:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-gotest/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: Set version from release tag
        run: npm version "${TAG#v}" --no-git-tag-version
        env:
          TAG: ${{ inputs.tag }}
      - run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode-gotest/*.vsix

  publish-github:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Upload .vsix to release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" *.vsix --clobber

  publish-marketplace:
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 15
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=mvrahden.gotest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Require a marketplace token
        working-directory: .
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_TOKEN }}
        run: test -n "$VSCE_PAT" || { echo "::error::VSCE_PAT is empty — the token never reached this job"; exit 1; }
      - working-directory: .
        run: npx @vscode/vsce publish --no-dependencies --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_TOKEN }}

  publish-openvsx:
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 15
    environment:
      name: open-vsx
      url: https://open-vsx.org/extension/mvrahden/gotest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Require an Open VSX token
        working-directory: .
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}
        run: test -n "$OVSX_PAT" || { echo "::error::OVSX_PAT is empty — the token never reached this job"; exit 1; }
      - working-directory: .
        run: npx ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}
