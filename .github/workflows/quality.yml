name: quality

on:
  push:
    branches: [main]
    paths-ignore: [vscode-gotest/**, site/**]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: [vscode-gotest/**, site/**]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Format check
        run: make fmt-check
      - name: Vuln check
        run: make vuln
      - name: Resolve the golangci-lint pin
        id: golangci
        run: echo "version=$(make -s golangci-version)" >> "$GITHUB_OUTPUT"
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --allow-parallel-runners ./... ./examples/...
      - name: Lint (windows)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        env:
          GOOS: windows
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --allow-parallel-runners ./... ./examples/...
      - name: Lint (darwin)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        env:
          GOOS: darwin
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --allow-parallel-runners ./... ./examples/...
      - name: Vet and lint (gotest)
        run: make lint
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: OpenSpec validate
        run: make spec-validate
      - name: Spec sync
        run: make catalog && git diff --exit-code docs/design/catalog.json
      # The skill's consumer fixture is the only in-repo proof of the
      # consumer-facing API shape; nothing else builds it.
      - name: Consumer fixture (skill evals)
        working-directory: tests/skillevals/writing-gotest-tests/consumer-fixture
        run: |
          go build ./... && go vet ./...
          go tool gotest ./...

  drill:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Drill
        env:
          DRILL_SHARD: ${{ matrix.shard }}/4
          DRILL_LOGS: ${{ runner.temp }}/drill-logs
        run: make drill
      - name: Keep drill logs and phase timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: drill-${{ matrix.shard }}
          path: ${{ runner.temp }}/drill-logs
          if-no-files-found: ignore

  drill-shards:
    needs: drill
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: drill-*
          path: ${{ runner.temp }}/drill-logs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Shards agree on one assignment
        run: bash tests/drill/drill.sh --check-shards "${{ runner.temp }}/drill-logs"
