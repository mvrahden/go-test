name: quality

on:
  push:
    branches: [main]
    paths-ignore: [vscode-gotest/**, site/**]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: [vscode-gotest/**, site/**]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Format check
        run: make fmt-check
      - name: Vuln check
        run: make vuln
      - name: Resolve the golangci-lint pin
        id: golangci
        run: echo "version=$(make -s golangci-version)" >> "$GITHUB_OUTPUT"
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --allow-parallel-runners ./... ./examples/...
      - name: Vet and lint (gotest)
        run: make lint
      # The skill's consumer fixture is the only in-repo proof of the
      # consumer-facing API shape; nothing else builds it.
      - name: Consumer fixture (skill evals)
        working-directory: skills/writing-gotest-tests/evals/consumer-fixture
        run: |
          go build ./... && go vet ./...
          go tool gotest ./...
      - name: Drill
        run: make drill
