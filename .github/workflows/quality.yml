name: quality

on:
  push:
    branches: [main]
    paths-ignore: [vscode-gotest/**]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: [vscode-gotest/**]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Format check
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Vuln check
        run: make vuln
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Must ship x/tools >= v0.46.0, the first that reads Go 1.27 export
          # data. Bump this whenever the Go version above moves.
          version: v2.13.2
          args: ./... ./examples/...
      - name: Lint (gotest)
        run: go run ./cmd/gotest lint ./... ./examples/...
