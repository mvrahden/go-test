name: quality

on:
  push:
    branches: [main]
    paths-ignore: [vscode-gotest/**]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: [vscode-gotest/**]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Format check
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Vuln check
        run: make vuln
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          install-mode: goinstall
          version: v1.64.8
          args: ./... ./examples/...
      - name: Lint (gotest)
        run: go run ./cmd/gotest-lint ./... ./examples/...
