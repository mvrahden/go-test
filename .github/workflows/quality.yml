name: quality

on:
  push:
    branches: [main]
    paths-ignore: [vscode-gotest/**, site/**]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: [vscode-gotest/**, site/**]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Format check
        run: make fmt-check
      - name: Vuln check
        run: make vuln
      - name: Resolve the golangci-lint pin
        id: golangci
        run: echo "version=$(make -s golangci-version)" >> "$GITHUB_OUTPUT"
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --allow-parallel-runners ./... ./examples/...
      - name: Lint (windows)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        env:
          GOOS: windows
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --allow-parallel-runners ./... ./examples/...
      - name: Lint (darwin)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        env:
          GOOS: darwin
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --allow-parallel-runners ./... ./examples/...
      - name: Vet and lint (gotest)
        run: make lint
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: OpenSpec validate
        run: make spec-validate
      - name: Spec sync
        run: make catalog && git diff --exit-code docs/design/catalog.json
      # The skill's consumer fixture is the only in-repo proof of the
      # consumer-facing API shape; nothing else builds it.
      - name: Consumer fixture (skill evals)
        working-directory: tests/skillevals/writing-gotest-tests/consumer-fixture
        run: |
          go build ./... && go vet ./...
          go tool gotest ./...
      - name: Drill
        run: make drill
