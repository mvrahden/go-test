name: release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Pinned, not "stable": a release must never be the first
          # place a new toolchain runs. Keep in step with quality.yml.
          go-version: "1.27"
      - run: make ci SPEC_FLAGS=--no-color

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Pinned, not "stable": a release must never be the first
          # place a new toolchain runs. Keep in step with quality.yml.
          go-version: "1.27"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          version="$TAG ($(git rev-parse --short HEAD))"
          go build -ldflags="-s -w -X 'github.com/mvrahden/go-test/internal/about.Version=${version}'" -o "gotest-${GOOS}-${GOARCH}${ext}" ./cmd/gotest
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" gotest-*

  update-major-tag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Update v1 tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="$TAG"
          major="${tag%%.*}"
          git tag -fa "$major" -m "$major"
          git push origin "$major" --force

  extension:
    if: ${{ !github.event.release.prerelease }}
    needs: build
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/extension-release.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets:
      OPENVSX_TOKEN: ${{ secrets.OVSX_PAT }}
