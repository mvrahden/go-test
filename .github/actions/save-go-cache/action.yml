name: "Save Go cache"
description: "Save the Go build and module cache .github/actions/setup-go restored, on a push to main only"

runs:
  using: "composite"
  steps:
    - name: Save the Go cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.GO_CACHE_PATHS }}
        key: ${{ env.GO_CACHE_KEY }}
